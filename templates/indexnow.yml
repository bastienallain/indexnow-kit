# .github/workflows/indexnow.yml — à copier dans le dépôt du SITE.
# Soumet à IndexNow ce qui a changé dans le sitemap, APRÈS la mise en ligne Vercel (tous plans, Hobby compris).
# Prérequis : indexnow-kit dans les dépendances du site (version figée par le lockfile).
# Variables du dépôt (Settings → Secrets and variables → Actions → Variables) : INDEXNOW_KEY, INDEXNOW_HOST.
name: IndexNow

on:
  deployment_status:
  # Filet de sécurité quotidien : rattrape les changements de contenu CMS et garde le cache d'état
  # en vie (GitHub évince un cache non consulté depuis 7 jours).
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:
    inputs:
      allow_mass:
        description: "Autoriser une soumission massive (après une vraie refonte)"
        type: boolean
        default: false

jobs:
  # actions/cache refuse deployment_status (« not tied to a branch or tag ref ») : l'état ne pourrait
  # être ni restauré ni sauvegardé. Ce job se contente de relancer le workflow en workflow_dispatch
  # sur la branche par défaut, où le cache fonctionne. Un workflow_dispatch créé avec GITHUB_TOKEN
  # lance bien un run : https://docs.github.com/en/actions/how-tos/write-workflows/choose-when-workflows-run/trigger-a-workflow
  relay:
    if: >-
      github.event_name == 'deployment_status' &&
      github.event.deployment_status.state == 'success' &&
      startsWith(github.event.deployment.environment, 'Production')
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      actions: write
    steps:
      - run: gh workflow run "$GITHUB_WORKFLOW" --repo "$GITHUB_REPOSITORY" --ref "${{ github.event.repository.default_branch }}"
        env:
          GH_TOKEN: ${{ github.token }}

  submit:
    if: github.event_name != 'deployment_status'
    # Concurrence sur ce job seulement : au niveau du workflow, un deployment_status (même un Preview
    # ignoré) pouvait annuler un workflow_dispatch en attente. Annuler un submit en attente au profit
    # d'un plus récent ne perd rien : le diff cumule depuis le dernier état sauvegardé.
    concurrency:
      group: indexnow-submit
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      INDEXNOW_KEY: ${{ vars.INDEXNOW_KEY }}
      INDEXNOW_HOST: ${{ vars.INDEXNOW_HOST }}
      INDEXNOW_ENABLED: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      # Avec pnpm : remplacer par pnpm/action-setup + `pnpm install --frozen-lockfile`, et `pnpm exec`.
      - run: bun install --frozen-lockfile

      - name: Restaurer l'état du dernier passage
        uses: actions/cache/restore@v4
        with:
          path: .indexnow
          key: indexnow-state-${{ github.run_id }}
          restore-keys: indexnow-state-

      - name: Vérifier le fichier de clé
        run: bunx --no-install indexnow-kit verify

      - name: Diff du sitemap et soumission
        run: >-
          bunx --no-install indexnow-kit sync
          --sitemap "https://${INDEXNOW_HOST}/sitemap.xml"
          ${{ inputs.allow_mass && '--allow-mass' || '' }}

      # Sauvegardé seulement si tout a réussi : sinon le prochain passage retentera.
      - name: Sauvegarder l'état
        if: success()
        uses: actions/cache/save@v4
        with:
          path: .indexnow
          key: indexnow-state-${{ github.run_id }}
